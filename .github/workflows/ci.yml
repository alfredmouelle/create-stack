name: CI


on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      marketing: ${{ steps.filter.outputs.marketing }}
      cli: ${{ steps.filter.outputs.cli }}
      packages: ${{ steps.filter.outputs.packages }}
      frameworks: ${{ steps.frameworks.outputs.frameworks }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: List supported frameworks
        id: frameworks
        run: echo "frameworks=$(node cli/scripts/list-frameworks.ts)" >> "$GITHUB_OUTPUT"
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        with:
          filters: |
            # Keep this list aligned with deploy-marketing.yml.
            marketing:
              - 'marketing/**'
              - 'cli/CHANGELOG.md'
              - 'cli/package.json'
              - 'packages/stack-config/**'
              - 'packages/*/capability.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-marketing.yml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.npmrc'
            cli:
              - 'cli/**'
              - 'apps/**'
              - 'packages/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish.yml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.npmrc'
              - 'turbo.json'
              - 'tsconfig.base.json'
            packages:
              - 'packages/**'
              - 'cli/**'
              - 'apps/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.npmrc'
              - 'turbo.json'
              - 'tsconfig.base.json'

  lint:
    name: lint (biome)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Biome checks
        run: pnpm check

  build-tests:
    name: cli (typecheck, unit, acceptance)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck CLI
        run: pnpm --filter @alfredmouelle/create-stack typecheck
      - name: Run CLI tests
        run: pnpm --filter @alfredmouelle/create-stack test

  shared-packages:
    name: shared packages (typecheck, tests)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck shared packages
        run: pnpm --filter "./packages/*" typecheck
      - name: Run shared package tests
        run: pnpm --filter "./packages/*" test

  base-apps:
    name: reference applications (typecheck, tests)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck reference applications
        run: pnpm --filter "./apps/*" typecheck
      - name: Run reference application tests
        run: pnpm --filter "./apps/*" test

  smoke:
    name: cli smoke (${{ matrix.framework }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.changes.outputs.frameworks) }}
    steps:
      - name: Skip smoke tests when CLI is unchanged
        if: needs.changes.outputs.cli != 'true'
        run: echo "CLI changes not detected; smoke tests are not required."
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: needs.changes.outputs.cli == 'true'
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        if: needs.changes.outputs.cli == 'true'
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: needs.changes.outputs.cli == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.cli == 'true'
      - name: Run CLI smoke tests
        run: pnpm --filter @alfredmouelle/create-stack test:smoke
        if: needs.changes.outputs.cli == 'true'
        env:
          SMOKE_FRAMEWORK: ${{ matrix.framework }}

  marketing:
    name: marketing (typecheck, unit, browser)
    needs: changes
    if: needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck marketing site
        run: pnpm --filter @alfredmouelle/marketing typecheck
      - name: Run marketing unit tests
        run: pnpm --filter @alfredmouelle/marketing test
      - name: Install Playwright Chromium
        run: pnpm --filter @alfredmouelle/marketing exec playwright install --with-deps chromium
      - name: Run marketing browser tests
        run: pnpm --filter @alfredmouelle/marketing test:e2e
