name: CI


on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      marketing: ${{ steps.filter.outputs.marketing }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Keep this list aligned with deploy-marketing.yml.
            marketing:
              - 'marketing/**'
              - 'cli/CHANGELOG.md'
              - 'packages/stack-config/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-marketing.yml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            cli:
              - 'cli/**'
              - 'apps/**'
              - 'packages/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish.yml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'

  build-tests:
    name: build matrix (fast)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alfredmouelle/create-stack test

  smoke:
    name: smoke (${{ matrix.framework }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [tanstack, next]
    steps:
      - name: Skip smoke tests when CLI is unchanged
        if: needs.changes.outputs.cli != 'true'
        run: echo "CLI changes not detected; smoke tests are not required."
      - uses: actions/checkout@v5
        if: needs.changes.outputs.cli == 'true'
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.cli == 'true'
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.cli == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.cli == 'true'
      - run: pnpm --filter @alfredmouelle/create-stack test:smoke
        if: needs.changes.outputs.cli == 'true'
        env:
          SMOKE_FRAMEWORK: ${{ matrix.framework }}

  marketing:
    name: marketing (typecheck, unit, browser)
    needs: changes
    if: needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alfredmouelle/marketing typecheck
      - run: pnpm --filter @alfredmouelle/marketing test
      - run: pnpm --filter @alfredmouelle/marketing exec playwright install --with-deps chromium
      - run: pnpm --filter @alfredmouelle/marketing test:e2e
