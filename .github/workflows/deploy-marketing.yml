name: Deploy marketing site

on:
  push:
    branches:
      - main
    paths:
      - marketing/**
      - cli/CHANGELOG.md
      - cli/package.json
      - packages/stack-config/**
      - packages/*/capability.json
      - .github/workflows/deploy-marketing.yml
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .npmrc
  workflow_dispatch:
    inputs:
      worker_url:
        description: Full URL of the deployed Worker to verify after deployment
        required: true
        type: string

concurrency:
  group: deploy-marketing
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy marketing Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build, smoke test, and deploy
        run: pnpm --filter @alfredmouelle/marketing run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed Worker
        run: pnpm --filter @alfredmouelle/marketing verify:deployment
        env:
          MARKETING_DEPLOYMENT_URL: ${{ inputs.worker_url || 'https://create-stack.alfredmouelle.com' }}
