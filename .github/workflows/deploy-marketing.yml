name: Deploy marketing Worker

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: Full URL of the deployed Worker to verify after deployment
        required: true
        type: string

concurrency:
  group: deploy-marketing
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy marketing Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, smoke test, and deploy
        run: pnpm --filter @alfredmouelle/marketing run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed Worker
        run: pnpm --filter @alfredmouelle/marketing verify:deployment
        env:
          MARKETING_DEPLOYMENT_URL: ${{ inputs.worker_url }}
